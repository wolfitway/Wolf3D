[tool.pyrefly]
python-interpreter-path = "scripts/hunyuan3d/venv/bin/python"
search-path = [
    "scripts/hunyuan3d",
    "scripts/hunyuan3d/Hunyuan3D-2"
]
exclude = [
    "scripts/hunyuan3d/Hunyuan3D-2/**",
    "**/venv/**",
    "node_modules/**"
]
project-excludes = [
    "scripts/hunyuan3d/Hunyuan3D-2/**",
    "**/venv/**",
    "node_modules/**"
]

[tool.pyright]
